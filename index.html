<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>USSD Mobile Phone Simulator</title>
    <style>
        :root {
            --bg: #0f172a;
            --bgw: #94a3b8;
            --panel: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            margin: 0;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 32px;
            flex-wrap: wrap;
        }

        /* Phone Frame */
        .phone {
            width: 340px;
            height: 680px;
            background: #090d16;
            border: 10px solid #273449;
            border-radius: 42px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .status-bar {
            padding: 10px 20px;
            font-size: 12px;
            font-weight: 600;
            color: #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0d1320;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .signal-group {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
        }

        .battery-icon {
            display: inline-flex;
            align-items: center;
        }

        .battery-body {
            width: 33px;
            height: 15px;
            border: 1.2px solid rgba(255, 255, 255, 0.45);
            border-radius: 4px;
            padding: 1.5px;
            display: flex;
            align-items: center;
        }

        .battery-fill {
            width: 100%;
            height: 100%;
            background: #e2e8f0;
            color: #090d16;
            border-radius: 2px;
            font-size: 8.5px;
            font-weight: 800;
            letter-spacing: -0.4px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .battery-cap {
            width: 1.5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.45);
            border-radius: 0 1px 1px 0;
            margin-left: 1px;
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            background: linear-gradient(180deg, #0f172a 0%, #090d16 100%);
        }

        .dial-display {
            width: 100%;
            min-height: 42px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 30px;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 20px;
            outline: none;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }

        .key {
            height: 58px;
            border-radius: 50%;
            border: 1px solid #1e293b;
            background: #141e33;
            color: #fff;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        .key:hover {
            background: #1e293b;
        }

        .key small {
            font-size: 9px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .call-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            padding-bottom: 10px;
        }

        .btn-call {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
        }

        .btn-del {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 18px;
            cursor: pointer;
        }

        /* Native USSD Modal Overlay */
        .ussd-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            z-index: 10;
        }

        .ussd-backdrop.active {
            display: flex;
        }

        .ussd-dialog {
            width: 100%;
            background: #f8fafc;
            color: #0f172a;
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        .ussd-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #64748b;
            margin-bottom: 8px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 6px;
        }

        .ussd-body {
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.45;
            min-height: 72px;
            max-height: 260px;
            overflow-y: auto;
            margin-bottom: 12px;
        }

        .ussd-input {
            width: 100%;
            border: none;
            border-bottom: 2px solid #0284c7;
            padding: 6px 2px;
            font-size: 16px;
            outline: none;
            background: transparent;
            margin-bottom: 14px;
        }

        .ussd-actions {
            display: flex;
            justify-content: flex-end;
            gap: 16px;
        }

        .ussd-actions button {
            background: none;
            border: none;
            font-weight: 600;
            font-size: 14px;
            color: #0284c7;
            cursor: pointer;
            padding: 4px 8px;
        }

        .ussd-actions button.cancel {
            color: #64748b;
        }

        /* Config & Inspector Panel */
        .inspector {
            width: 500px;
            max-width: 100%;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .inspector h2 {
            margin: 0 0 4px;
            font-size: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
        }

        .field label {
            color: var(--muted);
        }

        .field input,
        .field select {
            background: #0f172a;
            border: 1px solid var(--border);
            color: #fff;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 13px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        pre {
            margin: 0;
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            color: #38bdf8;
            max-height: 210px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .warn {
            color: #f59e0b;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <!-- Mobile Phone UI -->
    <div class="phone">
        <div class="status-bar">
            <span id="clock">00:00</span>
            <div class="status-icons">
                <span class="signal-group">
                    <svg class="signal-icon" width="15" height="11" viewBox="0 0 15 11" fill="currentColor" aria-hidden="true">
                        <rect x="0" y="7" width="2.5" height="4" rx="0.7" />
                        <rect x="4" y="5" width="2.5" height="6" rx="0.7" />
                        <rect x="8" y="2.5" width="2.5" height="8.5" rx="0.7" />
                        <rect x="12" y="0" width="2.5" height="11" rx="0.7" />
                    </svg>
                    <span>5G</span>
                </span>
                <span class="battery-icon" aria-label="Battery 100%">
                    <span class="battery-body">
                        <span class="battery-fill">100%</span>
                    </span>
                    <span class="battery-cap"></span>
                </span>
            </div>
        </div>

        <div class="screen">
            <input id="dialDisplay" class="dial-display" value="" readonly />
            <div class="keypad" id="keypad"></div>
            <div class="call-row">
                <button class="btn-call" onclick="startSession()" title="Dial USSD">&#9742;</button>
                <button class="btn-del" onclick="backspace()" title="Delete">&#9003;</button>
            </div>
        </div>

        <!-- USSD Popup Overlay -->
        <div class="ussd-backdrop" id="ussdModal">
            <div class="ussd-dialog">
                <div class="ussd-meta">
                    <span id="charCount">0 / 160 chars</span>
                    <span id="timerLabel">180s</span>
                </div>
                <div class="ussd-body" id="ussdBody">Running USSD code...</div>
                <input id="ussdInput" class="ussd-input" placeholder="Enter reply..." autocomplete="off" />
                <div class="ussd-actions" id="ussdActions"></div>
            </div>
        </div>
    </div>

    <!-- Configuration & Payload Inspector -->
    <div class="inspector">
        <h2>USSD Gateway Simulator</h2>
        <em>Update the fields below to your actual values</em>
        <div class="field">
            <label>Backend Callback URL</label>
            <input id="endpointUrl" placeholder="http://localhost:3000/api/ussd" />
        </div>

        <div class="row">
            <div class="field">
                <label>Subscriber Phone (MSISDN)</label>
                <input id="phoneNumber" placeholder="+2348012345678" />
            </div>
            <div class="field">
                <label>Active Session ID</label>
                <input id="sessionId" readonly />
            </div>
        </div>

        <div class="row">
            <div class="field">
                <label>Payload Format</label>
                <select id="payloadFormat">
                    <option value="form">Form URL-Encoded</option>
                    <option value="json">JSON Webhook</option>
                </select>
            </div>
            <div class="field">
                <label>Input Accumulation Mode</label>
                <select id="inputMode">
                    <option value="concat">Concatenated</option>
                    <option value="single">Last Input Only</option>
                </select>
            </div>
        </div>

        <div class="field">
            <label>Last Request Sent</label>
            <pre id="reqLog">Dial *7707# to start...</pre>
        </div>

        <div class="field">
            <label>Last Response Received <span id="latencyBadge"></span></label>
            <pre id="resLog">—</pre>
        </div>
    </div>

    <script>
        const ALLOWED_BASE_CODE = "*7707#";
        const VALID_USSD_REGEX = /^\*7707(\*[^*#]+)*#$/;

        function updateStatusClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, "0");
            const minutes = String(now.getMinutes()).padStart(2, "0");
            document.getElementById("clock").textContent = `${hours}:${minutes}`;
        }
        updateStatusClock();
        setInterval(updateStatusClock, 1000);

        const keys = [
            ["1", ""],
            ["2", "ABC"],
            ["3", "DEF"],
            ["4", "GHI"],
            ["5", "JKL"],
            ["6", "MNO"],
            ["7", "PQRS"],
            ["8", "TUV"],
            ["9", "WXYZ"],
            ["*", ""],
            ["0", "+"],
            ["#", ""]
        ];

        const keypadEl = document.getElementById("keypad");
        const dialDisplay = document.getElementById("dialDisplay");
        keys.forEach(([num, letters]) => {
            const btn = document.createElement("button");
            btn.className = "key";
            btn.innerHTML = `${num}<small>${letters}</small>`;
            btn.onclick = () => {
                dialDisplay.value += num;
            };
            keypadEl.appendChild(btn);
        });

        function backspace() {
            dialDisplay.value = dialDisplay.value.slice(0, -1);
        }

        let state = {
            sessionId: "",
            serviceCode: "",
            inputs: [],
            timer: null,
            secondsLeft: 180
        };

        function parseDialedCode(code) {
            if (!VALID_USSD_REGEX.test(code)) return null;
            const suffix = code.slice(5, -1); // strips "*7707" and trailing "#"
            const initialInputs = suffix.startsWith("*") ? suffix.slice(1).split("*") : [];
            return {
                serviceCode: ALLOWED_BASE_CODE,
                initialInputs
            };
        }

        function resetTimer() {
            clearInterval(state.timer);
            state.secondsLeft = 180;
            document.getElementById("timerLabel").textContent = "180s";
            state.timer = setInterval(() => {
                state.secondsLeft--;
                document.getElementById("timerLabel").textContent = `${state.secondsLeft}s`;
                if (state.secondsLeft <= 0) {
                    closeModal("END Connection timed out (180s inactivity).");
                }
            }, 1000);
        }

        function startSession() {
            const code = dialDisplay.value.trim();
            if (!code) return;

            const parsed = parseDialedCode(code);
            if (!parsed) {
                document.getElementById("sessionId").value = "";
                document.getElementById("latencyBadge").textContent = "(Blocked • MMI Error)";
                document.getElementById("reqLog").textContent = `DIAL ${code}\nStatus: Rejected locally`;
                document.getElementById("resLog").textContent =
                    `Invalid shortcode "${code}". Only *7707# and its sub-codes (e.g. *7707*1#) are permitted.`;
                updateCharCount("Connection problem or invalid MMI code.");
                closeModal("Connection problem or invalid MMI code.");
                return;
            }

            state.sessionId = "SIM_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
            state.serviceCode = parsed.serviceCode;
            state.inputs = [...parsed.initialInputs];
            document.getElementById("sessionId").value = state.sessionId;

            const initialStep = state.inputs.length > 0 ? state.inputs[state.inputs.length - 1] : "";
            openModal("Dialing " + code + "...", false);
            sendStep(initialStep);
        }

        function submitReply() {
            const val = document.getElementById("ussdInput").value.trim();
            if (!val) return;
            state.inputs.push(val);
            document.getElementById("ussdInput").value = "";
            sendStep(val);
        }

        async function sendStep(latestInput) {
            resetTimer();
            const url = document.getElementById("endpointUrl").value.trim();
            const phoneNumber = document.getElementById("phoneNumber").value.trim();
            const format = document.getElementById("payloadFormat").value;
            const mode = document.getElementById("inputMode").value;

            const textValue = mode === "concat" ? state.inputs.join("*") : latestInput;
            const payloadObj = {
                sessionId: state.sessionId,
                serviceCode: state.serviceCode,
                phoneNumber,
                text: textValue
            };

            const headers = {};
            let body;
            if (format === "form") {
                headers["Content-Type"] = "application/x-www-form-urlencoded";
                body = new URLSearchParams(payloadObj).toString();
            } else {
                headers["Content-Type"] = "application/json";
                body = JSON.stringify(payloadObj);
            }

            document.getElementById("reqLog").textContent =
                `POST ${url}\nContent-Type: ${headers["Content-Type"]}\n\n${format === "json" ? JSON.stringify(payloadObj, null, 2) : body}`;

            const t0 = performance.now();
            try {
                const res = await fetch(url, {
                    method: "POST",
                    headers,
                    body
                });
                const ms = Math.round(performance.now() - t0);
                const rawText = await res.text();

                document.getElementById("latencyBadge").textContent = `(${res.status} • ${ms}ms)`;
                document.getElementById("resLog").textContent = rawText;

                handleGatewayResponse(rawText);
            } catch (err) {
                document.getElementById("resLog").textContent =
                    `Network/CORS Error: ${err.message}\n\nTip: Enable CORS on your dev endpoint or route through a local proxy.`;
                closeModal("END Connection problem or invalid MMI code.");
            }
        }

        function handleGatewayResponse(raw) {
            let isEnd = false;
            let displayMessage = raw;

            try {
                const parsed = JSON.parse(raw);
                displayMessage = parsed.message || parsed.text || raw;
                isEnd = Boolean(parsed.shouldClose || parsed.end || parsed.type === "END");
            } catch (_) {
                if (raw.startsWith("END ")) {
                    isEnd = true;
                    displayMessage = raw.slice(4);
                } else if (raw.startsWith("CON ")) {
                    isEnd = false;
                    displayMessage = raw.slice(4);
                }
            }

            updateCharCount(displayMessage);
            if (isEnd) {
                closeModal(displayMessage);
            } else {
                openModal(displayMessage, true);
            }
        }

        function updateCharCount(msg) {
            const el = document.getElementById("charCount");
            el.textContent = `${msg.length} / 160 chars`;
            el.className = msg.length > 160 ? "warn" : "";
        }

        function openModal(message, allowInput) {
            const modal = document.getElementById("ussdModal");
            const input = document.getElementById("ussdInput");
            const actions = document.getElementById("ussdActions");

            document.getElementById("ussdBody").textContent = message;
            input.style.display = allowInput ? "block" : "none";
            actions.innerHTML = allowInput ?
                `<button class="cancel" onclick="dismissModal()">Cancel</button><button onclick="submitReply()">Send</button>` :
                `<button class="cancel" onclick="dismissModal()">Cancel</button>`;

            modal.classList.add("active");
            if (allowInput) setTimeout(() => input.focus(), 50);
        }

        function closeModal(finalMessage) {
            clearInterval(state.timer);
            const clean = finalMessage.replace(/^END\s+/, "");
            document.getElementById("ussdBody").textContent = clean;
            document.getElementById("ussdInput").style.display = "none";
            document.getElementById("ussdActions").innerHTML = `<button onclick="dismissModal()">OK</button>`;
            document.getElementById("ussdModal").classList.add("active");
        }

        function dismissModal() {
            clearInterval(state.timer);
            document.getElementById("ussdModal").classList.remove("active");
        }

        document.getElementById("ussdInput").addEventListener("keydown", (e) => {
            if (e.key === "Enter") submitReply();
        });
    </script>
</body>

</html>
